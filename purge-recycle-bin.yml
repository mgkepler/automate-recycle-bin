schedules:
- cron: "0 2 * * *" # Se ejecuta diariamente a las 2:00 AM
  displayName: Purga diaria de papelera
  branches:
    include:
    - main
  always: true

trigger: none

jobs:
- job: EmptyRecycleBin
  pool:
    vmImage: 'ubuntu-latest'
  steps:
  - task: PowerShell@2
    displayName: 'Vaciar Recycle Bin de Artifacts'
    inputs:
      targetType: 'inline'
      script: |
        $orgUrl = $env:SYSTEM_COLLECTIONURI
        $orgName = $orgUrl.TrimEnd('/').Split('/')[-1]
        $project = $env:SYSTEM_TEAMPROJECT
        $feed = $env:FEED_NAME
        $apiVersion = "7.1-preview.1"
        $headers = @{ Authorization = "Bearer $env:SYSTEM_ACCESSTOKEN" }
        
        # Endpoints candidatos para Feeds API
        $candidateUrls = @(
            "https://feeds.dev.azure.com/$orgName/$project/_apis/packaging/feeds/$feed/recyclebin/packages?api-version=$apiVersion",
            "https://feeds.dev.azure.com/$orgName/_apis/packaging/feeds/$feed/recyclebin/packages?api-version=$apiVersion",
            "https://dev.azure.com/$orgName/$project/_apis/packaging/feeds/$feed/recyclebin/packages?api-version=$apiVersion",
            "https://dev.azure.com/$orgName/_apis/packaging/feeds/$feed/recyclebin/packages?api-version=$apiVersion"
        )
        
        $packagesInBin = $null
        $workingUrl = $null
        
        # 1. Probar endpoints hasta encontrar el correcto
        foreach ($url in $candidateUrls) {
            try {
                Write-Host "Probando endpoint: $url"
                $response = Invoke-RestMethod -Uri $url -Method Get -Headers $headers -ErrorAction Stop
                $packagesInBin = $response
                $workingUrl = $url
                Write-Host "¡Endpoint encontrado con éxito!"
                break
            } catch {
                Write-Host "No disponible en esta ruta."
            }
        }
        
        if (-not $workingUrl) {
            Write-Error "No se pudo conectar a ningún endpoint de Recycle Bin para el feed '$feed'."
            exit 1
        }
        
        $items = $packagesInBin.value
        
        if (-not $items -or $items.Count -eq 0) {
            Write-Host "La papelera de reciclaje ya está vacía."
            exit 0
        }
        
        Write-Host "Se encontraron $($items.Count) paquete(s) en la papelera. Eliminando..."
        
        $baseEndpoint = $workingUrl.Split('?')[0]
        
        # 2. Eliminar permanentemente cada paquete o versión
        foreach ($item in $items) {
            $packageId = $item.id
            if ($item.versions) {
                foreach ($ver in $item.versions) {
                    $verId = $ver.id
                    $deleteUrl = "${baseEndpoint}/${packageId}/versions/${verId}?api-version=$apiVersion"
                    Write-Host "Eliminando permanentemente versión $verId..."
                    Invoke-RestMethod -Uri $deleteUrl -Method Delete -Headers $headers
                }
            } else {
                $deleteUrl = "${baseEndpoint}/${packageId}?api-version=$apiVersion"
                Write-Host "Eliminando permanentemente paquete $packageId..."
                Invoke-RestMethod -Uri $deleteUrl -Method Delete -Headers $headers
            }
        }
        
        Write-Host "Papelera vaciada con éxito."
    env:
      SYSTEM_COLLECTIONURI: $(System.CollectionUri)
      SYSTEM_TEAMPROJECT: $(System.TeamProject)
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      FEED_NAME: "kepler-coach-cli-artifacts"