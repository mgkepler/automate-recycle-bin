schedules:
- cron: "0 2 * * *" # Se ejecuta diariamente a las 2:00 AM
  displayName: Purga diaria de papelera
  branches:
    include:
    - main
  always: true

trigger: none

jobs:
- job: EmptyRecycleBin
  pool:
    vmImage: 'ubuntu-latest'
  steps:
  - task: PowerShell@2
    displayName: 'Vaciar Recycle Bin de Artifacts'
    inputs:
      targetType: 'inline'
      script: |
        $org = $env:SYSTEM_COLLECTIONURI
        $project = $env:SYSTEM_TEAMPROJECT
        $feed = $env:FEED_NAME
        
        # Construcción de la URL de la API REST
        $url = "${org}${project}/_apis/packaging/Feeds/${feed}/RecycleBin/Packages?api-version=7.1"
        
        $headers = @{
            Authorization = "Bearer $env:SYSTEM_ACCESSTOKEN"
        }
        
        Write-Host "Vaciando papelera para el feed: $feed en $url"
        Invoke-RestMethod -Uri $url -Method Delete -Headers $headers
    env:
      SYSTEM_COLLECTIONURI: $(System.CollectionUri)
      SYSTEM_TEAMPROJECT: $(System.TeamProject)
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      FEED_NAME: "kepler-coach-cli-artifacts"