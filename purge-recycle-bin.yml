schedules:
- cron: "0 2 * * *" # Se ejecuta diariamente a las 2:00 AM
  displayName: Purga diaria de papelera
  branches:
    include:
    - main
  always: true

trigger: none

jobs:
- job: EmptyRecycleBin
  pool:
    vmImage: 'ubuntu-latest'
  steps:
  - task: PowerShell@2
    displayName: 'Vaciar Recycle Bin de Artifacts'
    inputs:
      targetType: 'inline'
      script: |
        $orgUrl = $env:SYSTEM_COLLECTIONURI
        $orgName = $orgUrl.TrimEnd('/').Split('/')[-1]
        $project = $env:SYSTEM_TEAMPROJECT
        $feed = $env:FEED_NAME
        
        # Subdominio oficial para las APIs REST de Packaging
        $baseUrl = "https://pkgs.dev.azure.com/$orgName"
        
        $headers = @{
            Authorization = "Bearer $env:SYSTEM_ACCESSTOKEN"
        }
        
        # 1. Intentar purga para Feed a nivel de Proyecto
        $urlProject = "$baseUrl/$project/_apis/packaging/feeds/$feed/recyclebin/packages?api-version=7.1-preview.1"
        
        try {
            Write-Host "Ejecutando vaciado en nivel de proyecto: $urlProject"
            Invoke-RestMethod -Uri $urlProject -Method Delete -Headers $headers
            Write-Host "Papelera vaciada con éxito a nivel de proyecto."
        } catch {
            # 2. Si falla a nivel de proyecto, intentar a nivel de Organización
            Write-Host "No se encontró el endpoint a nivel de proyecto. Intentando a nivel de Organización..."
            $urlOrg = "$baseUrl/_apis/packaging/feeds/$feed/recyclebin/packages?api-version=7.1-preview.1"
            Invoke-RestMethod -Uri $urlOrg -Method Delete -Headers $headers
            Write-Host "Papelera vaciada con éxito a nivel de organización."
        }
    env:
      SYSTEM_COLLECTIONURI: $(System.CollectionUri)
      SYSTEM_TEAMPROJECT: $(System.TeamProject)
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      FEED_NAME: "kepler-coach-cli-artifacts"